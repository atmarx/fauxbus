# Grype acks for the Fauxbus container image.
#
# CI scans the image it builds (see the `scan-image` step) and fails on
# any finding at Medium or above that is not acknowledged here.  An ack
# is a statement that someone read the CVE and decided it does not
# reach Fauxbus.  It is not a way to make a red build go green.
#
# THE RULE: every ack pins three things, CVE + package name + exact
# installed version, and says why in `reason`.
#
# The version pin is what makes an ack expire by itself.  Grype only
# suppresses a match when every field in the rule agrees, so the moment
# the package changes (a rebuild picks up Alpine's next busybox, the
# python tag moves to 3.13.17), the rule stops matching and the finding
# comes back for a fresh look.  Maybe the new version fixed it, and the
# entry is dead weight to delete.  Maybe it didn't, and re-acking takes
# one line.  Either way a person looks at it again.  Nothing here can
# go on suppressing a CVE that later became fixable, which is what a
# bare `- vulnerability: CVE-...` line does: it stays silent forever,
# through every fix, in every package that ever carries that ID.
#
# Package names match exactly, so one CVE spread across several packages
# (busybox and its applet packages below) needs one entry per package.
#
# `reason` is not just a comment.  Grype echoes it back in the JSON
# output (`ignoredMatches[].appliedIgnoreRules`), so the justification
# travels with every scan result rather than staying in this file.
# `--show-suppressed` keeps acked findings visible in the table, marked
# "(suppressed)": acknowledged is not the same as invisible.
#
# Verified against grype v0.112.0 (the CI pin) on 2026-10-10: a rule
# pinned to the wrong version does not suppress, and `reason` survives
# into the output.

ignore:
  # --- busybox wget: request-line injection via raw CR/LF in the URL ---
  # Fauxbus never runs wget.  The image's own healthcheck uses Python's
  # urllib, and the entrypoint uses only busybox's `sh`.  ssl_client is
  # wget's HTTPS helper, so it is unreachable for the same reason.
  # Alpine has published no fix yet (blank fix state).
  - vulnerability: CVE-2025-60876
    package: { name: busybox, version: 1.37.0-r31 }
    reason: "2026-10-10 ash: wget applet, never invoked by Fauxbus (healthcheck is urllib, entrypoint is sh). No Alpine fix yet."
  - vulnerability: CVE-2025-60876
    package: { name: busybox-binsh, version: 1.37.0-r31 }
    reason: "2026-10-10 ash: wget applet, never invoked by Fauxbus (healthcheck is urllib, entrypoint is sh). No Alpine fix yet."
  - vulnerability: CVE-2025-60876
    package: { name: ssl_client, version: 1.37.0-r31 }
    reason: "2026-10-10 ash: wget's HTTPS helper, unreachable because Fauxbus never invokes wget. No Alpine fix yet."

  # --- CPython: fixes only on unreleased lines ------------------------
  # Grype reports these as "fixed", but the fixes landed in 3.15/3.16
  # pre-releases and no 3.13 release carries them, so a rebuild cannot
  # clear them.  Re-acked 2026-11-07 when the base moved 3.13.16 ->
  # 3.13.18 and the old pins expired as designed.  CVE-2026-12345
  # (tempfile) no longer matches on 3.13.18, so its ack is gone.
  - vulnerability: CVE-2025-15367
    package: { name: python, version: 3.13.18 }
    reason: "2026-11-07 ash: poplib command injection. Fauxbus never imports poplib (checked in the image: not in sys.modules after importing every fauxbus module). Fixed only in 3.15.0a6."
  - vulnerability: CVE-2026-116566
    package: { name: python, version: 3.13.18 }
    reason: "2026-11-07 ash: getaddrinfo accepts NUL bytes in host/port. Fauxbus only resolves its own bind address and the test author's own base_url; no untrusted party supplies a hostname. Fixed only in 3.16.0."

  # --- SQLite: Alpine 3.53.4-r0, no Alpine fix yet ---------------------
  # sqlite-libs is in the image only because the python base installs
  # it for the stdlib sqlite3 module (`apk info -r` names only
  # .python-rundeps).  Fauxbus keeps state in memory and never imports
  # sqlite3: checked 2026-11-07 inside the built image, importing every
  # fauxbus module leaves sqlite3, _sqlite3 and dbm.sqlite3 out of
  # sys.modules, and there is no sqlite3 CLI for the .recover bug to
  # reach.  Every one of these needs an attacker-supplied database or
  # SQL, and Fauxbus opens neither.  Alpine's 3.54 build will change the
  # version and expire all nine at once.
  - vulnerability: CVE-2026-119586
    package: { name: sqlite-libs, version: 3.53.4-r0 }
    reason: "2026-11-07 ash: sqlite3 CLI .recover command injection; no CLI in the image. Fauxbus never loads SQLite (sqlite3 absent from sys.modules in the image). No Alpine fix yet."
  - vulnerability: CVE-2026-119379
    package: { name: sqlite-libs, version: 3.53.4-r0 }
    reason: "2026-11-07 ash: session-extension changeset overflow. Fauxbus never loads SQLite (sqlite3 absent from sys.modules in the image). No Alpine fix yet."
  - vulnerability: CVE-2026-119374
    package: { name: sqlite-libs, version: 3.53.4-r0 }
    reason: "2026-11-07 ash: FTS5 secure-delete overflow. Fauxbus never loads SQLite (sqlite3 absent from sys.modules in the image). No Alpine fix yet."
  - vulnerability: CVE-2026-119373
    package: { name: sqlite-libs, version: 3.53.4-r0 }
    reason: "2026-11-07 ash: FTS5 prefix-merge overflow. Fauxbus never loads SQLite (sqlite3 absent from sys.modules in the image). No Alpine fix yet."
  - vulnerability: CVE-2026-119378
    package: { name: sqlite-libs, version: 3.53.4-r0 }
    reason: "2026-11-07 ash: R-Tree use-after-free. Fauxbus never loads SQLite (sqlite3 absent from sys.modules in the image). No Alpine fix yet."
  - vulnerability: CVE-2026-119375
    package: { name: sqlite-libs, version: 3.53.4-r0 }
    reason: "2026-11-07 ash: WAL page-cache disclosure. Fauxbus never loads SQLite (sqlite3 absent from sys.modules in the image). No Alpine fix yet."
  - vulnerability: CVE-2026-119371
    package: { name: sqlite-libs, version: 3.53.4-r0 }
    reason: "2026-11-07 ash: CTE depth stack exhaustion. Fauxbus never loads SQLite (sqlite3 absent from sys.modules in the image). No Alpine fix yet."
  - vulnerability: CVE-2026-119376
    package: { name: sqlite-libs, version: 3.53.4-r0 }
    reason: "2026-11-07 ash: COLLATE depth stack exhaustion. Fauxbus never loads SQLite (sqlite3 absent from sys.modules in the image). No Alpine fix yet."
  - vulnerability: CVE-2026-119591
    package: { name: sqlite-libs, version: 3.53.4-r0 }
    reason: "2026-11-07 ash: count-of-view stack exhaustion. Fauxbus never loads SQLite (sqlite3 absent from sys.modules in the image). No Alpine fix yet."
  - vulnerability: CVE-2026-119372
    package: { name: sqlite-libs, version: 3.53.4-r0 }
    reason: "2026-11-07 ash: FTS3 snippet use-after-free. Fauxbus never loads SQLite (sqlite3 absent from sys.modules in the image). No Alpine fix yet."

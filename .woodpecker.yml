# Fauxbus CI — the conformance tether, mechanized.
#
# SPEC.md promises "one test suite, two backends: Fauxbus on every CI run,
# the real Globus service env-gated before each release."  This file is the
# first half of that promise.  The second half arrives with the recording
# session (see RELEASING.md for the honest posture until then).
#
# Fauxbus is a library, not a service — no deploy step.  What ships is a
# wheel and an image, so CI builds and boots both.
#
# THE TRUST ARC (a lesson worth keeping): build #1 failed because
# untrusted repos may not mount `volumes` — correctly, since this config
# lives in the repo and a config that could mount /var/run/docker.sock
# would hand the host to anyone who can push a branch.  The refusal was
# the security model working.  An admin has since marked the repo
# trusted, which is a statement about who can push here, not about
# Woodpecker relaxing: the socket mount below is exactly as dangerous as
# it always was, and belongs only in repos where every committer could
# already root the host by other means.
#
# Pip cache mounted at /opt/cache/pip, per house convention.

# Tags get their own pipeline too: a tag re-verifies the exact tagged
# commit, and `event: tag` is what the parked publish-pypi step at the
# bottom will hang on once restored.
when:
  - event: push
  - event: tag

labels:
  host: xdocker01

matrix:
  PYTHON:
    - "3.11"
    - "3.12"
    - "3.13"

steps:
  # `ruff check` only — deliberately no `ruff format --check`.  pyproject
  # ignores E501 at line-length 100, which is the author saying line breaks
  # are a human call in this codebase; a formatter gate would overrule that.
  - name: lint
    image: python:${PYTHON}-slim
    commands:
      - pip install --cache-dir /cache/pip -e ".[dev]"
      - ruff check src/ tests/
    volumes:
      - /opt/cache/pip:/cache/pip

  # FAUXBUS_REQUIRE_CONFORMANCE is the point of this step, not decoration.
  # tests/test_sdk_conformance.py guards its import with `importorskip` so a
  # bare checkout still runs; that same guard means a CI image missing
  # globus-sdk would drop every SDK test and still go green.  The env var
  # turns that skip into a collection error, so "the SDK is the contract"
  # stays a fact about this pipeline rather than a claim in a README.
  - name: test
    image: python:${PYTHON}-slim
    environment:
      FAUXBUS_REQUIRE_CONFORMANCE: "1"
    commands:
      - pip install --cache-dir /cache/pip -e ".[dev,conformance]"
      - python -c "import globus_sdk; print('SDK under test:', globus_sdk.__version__)"
      - pytest -v --tb=short
    volumes:
      - /opt/cache/pip:/cache/pip

  # An editable install never exercises the wheel path, and the wheel is
  # what the container image and every consumer actually installs.  Build
  # it here so a packaging break fails CI instead of surfacing at
  # someone's `pipx install`.
  - name: build-wheel
    image: python:${PYTHON}-slim
    commands:
      - pip install --cache-dir /cache/pip build
      - python -m build --wheel
      - pip install --cache-dir /cache/pip dist/*.whl
      - fauxbus --help
    volumes:
      - /opt/cache/pip:/cache/pip
    depends_on:
      - test

  # The image is shipped documentation: examples/compose.yaml tells
  # consumers to build it, and root-cellar's deploy module actually does.
  # This step proves the Containerfile builds, boots, and answers the
  # same unauthenticated /_fauxbus/ probe the HEALTHCHECK uses — the
  # thing compose's `depends_on: service_healthy` hangs on.  Gated to one
  # matrix cell: the image pins its own Python, so building it three
  # times would test Woodpecker, not Fauxbus.
  #
  # Names key on CI_PIPELINE_NUMBER, not the commit SHA: a push to main
  # and a fleet branch can carry the SAME sha and run concurrently, and
  # two `docker run --name fauxbus-ci-<sha>` would collide.  The
  # pipeline number is unique by construction.
  - name: build-image
    image: docker:cli
    when:
      matrix:
        PYTHON: "3.13"
    environment:
      # The Containerfile uses RUN --mount, a BuildKit feature; be
      # explicit rather than trusting the daemon's default.
      DOCKER_BUILDKIT: "1"
    commands:
      - docker build -f Containerfile -t fauxbus:ci-${CI_PIPELINE_NUMBER} .
      - docker run -d --name fauxbus-ci-${CI_PIPELINE_NUMBER} fauxbus:ci-${CI_PIPELINE_NUMBER}
      - |
        for i in $(seq 1 30); do
          docker exec fauxbus-ci-${CI_PIPELINE_NUMBER} python -c \
            "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9800/_fauxbus/', timeout=1)" \
            && break
          [ "$i" = "30" ] && { docker logs fauxbus-ci-${CI_PIPELINE_NUMBER}; exit 1; }
          sleep 1
        done
      # The SBOM must ride in the image and name what it claims to name
      # — an image that lost its bill of materials fails the build, not
      # a compliance review three months later.
      - |
        docker exec fauxbus-ci-${CI_PIPELINE_NUMBER} python -c \
          "import json; d = json.load(open('/usr/share/fauxbus/sbom.json')); names = sorted(c['name'] for c in d['components']); assert 'fauxbus' in names, names; print('SBOM components:', names)"
      - docker rm -f fauxbus-ci-${CI_PIPELINE_NUMBER}
      - docker rmi fauxbus:ci-${CI_PIPELINE_NUMBER} || true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - test

  # Tags publish themselves, as of 2026-08-08.  Written 2026-08-05 and
  # parked behind two conditions, both now met: pyproject's URLs point
  # somewhere the public can reach, and `pypi_token` exists as a
  # PROJECT-SCOPED token in this repo's Woodpecker secrets, allowed for
  # the `tag` event.  (PyPI's OIDC trusted publishing doesn't cover
  # Woodpecker, so a token it is.  Project-scoped means a leak costs
  # one package rather than the whole account.)
  #
  # The 0.1.2 upload was manual, which is the only way a first upload
  # can go: you cannot scope a token to a project that does not exist
  # yet.  RELEASING.md carries that sequence for the next new package.
  - name: publish-pypi
    image: python:${PYTHON}-slim
    when:
      event: tag
      matrix:
        PYTHON: "3.13"
    environment:
      # PyPI's literal username for token auth — not a placeholder.
      TWINE_USERNAME: __token__
      TWINE_PASSWORD:
        from_secret: pypi_token
    commands:
      - pip install --cache-dir /cache/pip build twine
      # Woodpecker only injects a secret into events it is explicitly
      # allowed for, and a secret that wasn't allowed for `tag` arrives
      # as an empty string rather than an error.  Twine would then fail
      # with an auth message that reads like a bad token, and you would
      # go re-mint a perfectly good credential.  Name the real cause.
      # Block scalar, not a plain one: a plain YAML scalar ends at the
      # first colon-space, so an unquoted message containing ": " parses
      # as a mapping and the step silently stops being a command list.
      - |
        test -n "$TWINE_PASSWORD" || {
          echo "pypi_token did not reach this step."
          echo "Check repo Settings -> Secrets: it must be allowed for the 'tag' event."
          exit 1
        }
      - python -m build
      # The tag names the version; the build had better agree.  A tag
      # pointing at a .dev0 commit must die here, not on PyPI —
      # uploads are burn-once.
      - test -f "dist/fauxbus-${CI_COMMIT_TAG#v}.tar.gz" || { echo "tag ${CI_COMMIT_TAG} does not match built version:"; ls dist/; exit 1; }
      - twine check dist/*
      # Deliberately NO --skip-existing.  It looks like the safe flag and
      # is the opposite: if a tag is ever force-moved to a new commit and
      # re-pushed, --skip-existing would see the version already on PyPI,
      # upload nothing, and go green — a silent wrong answer, which is
      # the one thing this project refuses to ship.  Re-running a
      # published tag's pipeline SHOULD go red and say "already exists",
      # because that is exactly what happened.
      - twine upload --non-interactive dist/*
    volumes:
      - /opt/cache/pip:/cache/pip
    depends_on:
      - test

# Fauxbus CI — the conformance tether, mechanized.
#
# SPEC.md promises "one test suite, two backends: Fauxbus on every CI run,
# the real Globus service env-gated before each release."  This file is the
# first half of that promise.  The second half arrives with the recording
# session; there is deliberately no hook for it here yet, because a gate
# nobody can run is worse than an honest gap.
#
# Fauxbus is a library, not a service — no deploy step.  What ships is a
# wheel and an image, so CI builds the wheel here (the image step waits on
# trust — see below).
#
# THE TRUST LESSON (build #1 failed exactly here): this pipeline config
# lives in the repo, and Woodpecker refuses `volumes` for repos below the
# "trusted" level — because a config that could mount /var/run/docker.sock
# or any host path would hand the host to anyone who can push a branch.
# That refusal is the security model working, not an obstacle.  So, until
# an admin marks the repo trusted in Woodpecker's settings:
#   - no pip cache mounts (dependencies download fresh each step — this
#     costs seconds; the packages are small),
#   - no container-image build (it needs the docker socket, full stop).
# The image step is preserved at the bottom, commented out, ready to
# restore the moment trust lands.

when:
  - event: push

labels:
  host: xdocker01

matrix:
  PYTHON:
    - "3.11"
    - "3.12"
    - "3.13"

steps:
  # `ruff check` only — deliberately no `ruff format --check`.  pyproject
  # ignores E501 at line-length 100, which is the author saying line breaks
  # are a human call in this codebase; a formatter gate would overrule that.
  - name: lint
    image: python:${PYTHON}-slim
    commands:
      - pip install -e ".[dev]"
      - ruff check src/ tests/

  # FAUXBUS_REQUIRE_CONFORMANCE is the point of this step, not decoration.
  # tests/test_sdk_conformance.py guards its import with `importorskip` so a
  # bare checkout still runs; that same guard means a CI image missing
  # globus-sdk would drop every SDK test and still go green.  The env var
  # turns that skip into a collection error, so "the SDK is the contract"
  # stays a fact about this pipeline rather than a claim in a README.
  - name: test
    image: python:${PYTHON}-slim
    environment:
      FAUXBUS_REQUIRE_CONFORMANCE: "1"
    commands:
      - pip install -e ".[dev,conformance]"
      - python -c "import globus_sdk; print('SDK under test:', globus_sdk.__version__)"
      - pytest -v --tb=short

  # An editable install never exercises the wheel path, and the wheel is
  # what the container image and every consumer actually installs.  Build
  # it here so a packaging break fails CI instead of surfacing at
  # someone's `pipx install`.
  - name: build-wheel
    image: python:${PYTHON}-slim
    commands:
      - pip install build
      - python -m build --wheel
      - pip install dist/*.whl
      - fauxbus --help
    depends_on:
      - test


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fauxbus"
# Derived from src/fauxbus/__init__.py — see [tool.hatch.version] below.
dynamic = ["version"]
description = "A wire-level fake of the Globus API for E2E testing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Marx" }]
keywords = ["globus", "testing", "fake", "http", "integration-tests"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
# Zero runtime dependencies, on purpose.  A test fake that consumers add
# to their dev environments should not bring a supply chain with it.
dependencies = []

[project.urls]
# Public, on purpose.  These become the sidebar links on the PyPI page
# and the "Homepage" a stranger clicks.  They pointed at the private
# Gitea through v0.1.0 and v0.1.1 — a host nobody outside the VPN can
# reach.  Gitea is still where CI runs; GitHub is where the public is.
Homepage = "https://github.com/atmarx/fauxbus"
Issues = "https://github.com/atmarx/fauxbus/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5,<1",
]
# The conformance suite drives the real globus-sdk against Fauxbus.
# The pin here IS the stated SDK contract version from SPEC.md — and it
# has to be an *exact* pin for that sentence to be true.  It used to read
# `>=4.8.1,<5`, which is a range: SPEC said the contract was 4.8.1 while
# the resolver quietly installed whatever was newest under 5.  By
# 2026-08-16 that was 4.9.0, so every CI run since 4.9.0 shipped had been
# conforming against an SDK the spec never named, and nothing said so.
# Principle 1 is "the SDK is the contract, pinned to a stated version" —
# a floating pin means the contract changes without a commit.
#
# Bumping is now a deliberate act: change this literal, change the
# CONTRACT_SDK_VERSION in tests/test_sdk_conformance.py to match, and let
# the suite tell you whether the fake still holds.  The assertion there
# fails loudly when the installed SDK and the stated contract disagree,
# because this project has now shipped three separate bugs whose whole
# shape was "the claim and the reality drifted and no test compared them."
conformance = [
    "globus-sdk==4.8.1",
]

[project.scripts]
fauxbus = "fauxbus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fauxbus"]

# One literal, one place.  This used to be a static `version =` up in
# [project], with a *second* copy of the same fact living in
# src/fauxbus/__init__.py.  Nothing tied them together, so the release
# ritual bumped one and forgot the other: v0.1.0 and v0.1.1 both shipped
# telling anyone who asked — `fauxbus --version`, the startup banner,
# GET /_fauxbus/ — that they were "0.1.0.dev0".
#
# Hatchling now reads the module's __version__ at build time, so the
# wheel filename, the PyPI metadata, and the answer the running server
# gives all come from the same string.  They can no longer disagree,
# because there is nothing left to disagree with.
[tool.hatch.version]
path = "src/fauxbus/__init__.py"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fauxbus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
